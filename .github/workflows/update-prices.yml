name: Update harga terbaru

on:
  schedule:
    - cron: "30 10 * * 1-5"    # 17:30 WIB, Senin sampai Jumat (bursa sudah tutup)
  workflow_dispatch:            # tombol "Run workflow" untuk menjalankan manual

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - run: python update_prices.py
      - name: Commit jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harga_terbaru.csv
          git diff --staged --quiet || (git commit -m "Update harga terbaru" && git push)
